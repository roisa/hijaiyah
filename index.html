<script>/* theme before first paint (no flash) */try{var m=(JSON.parse(localStorage.getItem("bmh_v1")||"{}").theme)||"auto";document.documentElement.setAttribute("data-theme",m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")}catch(e){}</script>
<script>/* big screens: scale the whole phone layout up, like the Baby Mo app does on iPad.
   Touch devices (iPad): through the viewport (a layout ~430–620 px wide shown bigger). The browser scales everything, so
   finger and element positions always agree. (CSS zoom did the same job, but on iPad Safari it made touch positions and
   element positions disagree: tracing missed the start dot and dragged pieces lagged behind the finger.)
   Desktop browsers ignore the viewport tag, so they keep CSS zoom (mouse positions are consistent there). */
(function(){var mv=document.querySelector('meta[name="viewport"]'),base=mv.getAttribute("content"),de=document.documentElement;
var touch=(window.matchMedia&&matchMedia("(pointer: coarse)").matches)||navigator.maxTouchPoints>1;
function fit(){var z=1;
if(touch){var sw=screen.width,sh=screen.height,o=screen.orientation&&screen.orientation.type,land=o?o.indexOf("landscape")===0:(window.orientation===90||window.orientation===-90);
var w=land?Math.max(sw,sh):Math.min(sw,sh),h=land?Math.min(sw,sh):Math.max(sw,sh);if(Math.min(w,h)>=700)z=Math.max(1,Math.min(w/430,h/900));
if(z>1.02){var zs=z.toFixed(3);mv.setAttribute("content","width="+Math.round(w/z)+", initial-scale="+zs+", minimum-scale="+zs+", maximum-scale="+zs+", user-scalable=no, viewport-fit=cover");}else mv.setAttribute("content",base);de.style.zoom="";}
else{var iw=innerWidth,ih=innerHeight;if(Math.min(iw,ih)>=700)z=Math.max(1,Math.min(iw/430,ih/900));de.style.zoom=z>1.02?z.toFixed(3):"";}
de.classList.toggle("big",z>1.02);de.style.setProperty("--vz",z>1.02?z:1);}
fit();addEventListener("resize",fit);addEventListener("orientationchange",function(){setTimeout(fit,120);});})();</script>
